services:
  - type: web
    name: falak-clinic-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DOCTOR_EMAIL
        sync: false
      - key: DOCTOR_PASSWORD
        sync: false
